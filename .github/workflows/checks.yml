name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, build, type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      # the build writes the route types the type check reads (LayoutProps in src/app/layout.tsx)
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Test (the rules eval, no keys)
        run: npm test
